<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      ONE theme-color tag, resolved per theme by the bootstrap below and by
      applyTheme (src/lib/theme.ts). One tag, not a media pair: A&I's
      Experience overrides this exact element and restores it on exit.
    -->
    <meta name="theme-color" content="#F4F7F3" />

    <!--
      DEFAULT METADATA — the corporate site.

      Per-route titles, descriptions, canonical and robots tags are applied at
      runtime by `usePageMeta`. These defaults are what a crawler that does not
      execute JavaScript sees, so they are a complete and honest description of
      the company rather than a placeholder.

      Nothing here references the private routes or anything personal.
    -->
    <title>PDA BLISS — พัฒนาซอฟต์แวร์ ระบบธุรกิจ และเว็บไซต์</title>
    <meta
      name="description"
      content="PDA BLISS COMPANY LIMITED รับพัฒนาซอฟต์แวร์ ระบบธุรกิจ เว็บแอปพลิเคชัน ระบบภายในองค์กร และ Automation ที่ออกแบบจากกระบวนการทำงานจริง"
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="PDA BLISS COMPANY LIMITED" />

    <meta property="og:site_name" content="PDA BLISS" />
    <meta property="og:title" content="PDA BLISS — พัฒนาซอฟต์แวร์ ระบบธุรกิจ และเว็บไซต์" />
    <meta
      property="og:description"
      content="PDA BLISS COMPANY LIMITED รับพัฒนาซอฟต์แวร์ ระบบธุรกิจ เว็บแอปพลิเคชัน ระบบภายในองค์กร และ Automation ที่ออกแบบจากกระบวนการทำงานจริง"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="th_TH" />
    <!--
      og:image / twitter:image need an ABSOLUTE url, so the build injects them
      here only when VITE_PUBLIC_ORIGIN is a safe https origin (vite.config.ts,
      `shareImage`). No canonical or og:url is written statically: this file is
      served for every route, so a static canonical would be wrong on all but
      one of them. Both are set per route at runtime. See docs/SEO.md.
    -->

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PDA BLISS — พัฒนาซอฟต์แวร์ ระบบธุรกิจ และเว็บไซต์" />
    <meta
      name="twitter:description"
      content="PDA BLISS COMPANY LIMITED รับพัฒนาซอฟต์แวร์ ระบบธุรกิจ เว็บแอปพลิเคชัน ระบบภายในองค์กร และ Automation ที่ออกแบบจากกระบวนการทำงานจริง"
    />

    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500&family=Noto+Serif+Thai:wght@300;400;500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap"
    />
    <!--
      THEME BOOTSTRAP — runs before first paint, deliberately inline.

      Reads the stored mode ('light' | 'dark' | 'system', default system) and
      writes the resolved theme onto <html> so the very first paint is already
      the right colour. An external module would arrive after the first frame,
      which is exactly the white flash this exists to prevent.

      Keep in step with `applyTheme` in src/lib/theme.ts — same key, same
      attribute, same colorScheme.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('pdabliss.theme');
          var mode = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var resolved = dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute('content', dark ? '#0E1311' : '#F4F7F3');
        } catch (error) {
          /* Blocked storage or no matchMedia: light is a safe, complete page. */
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <!--
      LOCALE BOOTSTRAP — the URL alone decides the language.

      /en/… is English, /zh/… is Simplified Chinese, everything else is Thai.
      Setting lang and data-locale before first paint means screen readers and
      the CJK font stack in global.css are right from the first frame, before
      React mounts. Keep in step with `splitLocalePath` / `applyDocumentLang`
      in src/i18n/locales.ts. The stored preference (pdabliss.locale) is NOT
      read here: a direct link always renders the language it names.
    -->
    <script>
      (function () {
        var segment = window.location.pathname.split('/')[1];
        var locale = segment === 'en' || segment === 'zh' ? segment : 'th';
        document.documentElement.lang = locale === 'zh' ? 'zh-Hans' : locale;
        document.documentElement.dataset.locale = locale;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
