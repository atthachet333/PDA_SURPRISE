    <path d="M20 46V18h13.5c6.1 0 10.5 4 10.5 9.7 0 5.8-4.4 9.8-10.5 9.8H27V46h-7Zm7-14.4h5.6c2.6 0 4.3-1.6 4.3-3.9 0-2.3-1.7-3.8-4.3-3.8H27v7.7Z" fill="#35C96F"/>
  </g>
  <text x="96" y="366" font-family="DejaVu Sans, Inter, Helvetica, Arial, sans-serif" font-weight="700" font-size="92" letter-spacing="-2" fill="#F2F6F3">PDA BLISS</text>
  <text x="98" y="424" font-family="DejaVu Sans, Inter, Helvetica, Arial, sans-serif" font-size="34" fill="#9EEEBB">Business Software · Web Apps · Websites</text>
  <text x="98" y="540" font-family="DejaVu Sans Mono, IBM Plex Mono, monospace" font-size="20" letter-spacing="3" fill="#B7C9BF" fill-opacity="0.85">PDA BLISS COMPANY LIMITED · BANGKOK, THAILAND</text>
