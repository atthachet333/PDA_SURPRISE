<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- PDA BLISS share card (EP44). Source for public/brand/og-default.png. Latin text only, so one card serves TH/EN/ZH. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1412"/>
      <stop offset="0.55" stop-color="#0A1F18"/>
      <stop offset="1" stop-color="#063B2A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#35C96F" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#35C96F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue" cx="0.05" cy="1" r="0.55">
      <stop offset="0" stop-color="#3476A8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3476A8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="minor" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7FD9A6" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="major" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M96 0H0V96" fill="none" stroke="#7FD9A6" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#ground)"/>
  <rect width="1200" height="630" fill="url(#minor)"/>
  <rect width="1200" height="630" fill="url(#major)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#blue)"/>
  <!-- system topology, right side -->
  <g fill="none" stroke="#7FD9A6" stroke-opacity="0.35" stroke-width="1.5">
    <path d="M768 96 H864 V192 H1056 V96 H1152"/>
    <path d="M864 192 V384 H960 V480 H1104"/>
    <path d="M1056 192 V288 H1152"/>
    <path d="M960 384 H1152"/>
  </g>
  <g fill="#35C96F">
    <circle cx="768" cy="96" r="5"/><circle cx="864" cy="192" r="6"/><circle cx="1056" cy="96" r="5"/>
    <circle cx="1056" cy="288" r="5"/><circle cx="960" cy="384" r="6"/><circle cx="1104" cy="480" r="5"/>
    <circle cx="1152" cy="384" r="5"/>
  </g>
  <g fill="none" stroke="#35C96F" stroke-opacity="0.45" stroke-width="1.5">
    <circle cx="864" cy="192" r="16"/><circle cx="960" cy="384" r="16"/>
  </g>
  <!-- mark -->
  <g transform="translate(96 150) scale(1.75)">
